name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: throughline
          POSTGRES_PASSWORD: throughline
          POSTGRES_DB: throughline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U throughline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type-check (mypy)
        run: mypy app/

      - name: Test (pytest, no API keys / no network required)
        run: pytest tests/ -q --cov=app --cov-report=term-missing

      - name: Policy benchmark (offline, no provider cost)
        run: python -m app.benchmark.runner

      - name: Verify Alembic migration applies cleanly to Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://throughline:throughline@localhost:5432/throughline
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
