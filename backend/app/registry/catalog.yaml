# Model catalogue (ADR-004).
#
# This file is DATA, not configuration of behaviour. It seeds the `models` table and can be edited and
# re-seeded without a code change or deploy.
#
# THE RULE THAT MATTERS: every pricing block carries `verified` + `verified_at` + `source`.
# RESEARCH 3.2 documents a pricing aggregator that was wrong by 50% on a flagship model two weeks after a
# change. Entries marked `verified: false` are best-effort and are surfaced as such in the admin UI and in
# every cost estimate derived from them. Do not flip `verified` to true without reading the vendor's own
# pricing page.
#
# Prices are USD per 1,000,000 tokens.

